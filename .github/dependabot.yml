version: 2
updates:
  # Maandelijks, en per ecosysteem alles in één pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      ontwikkeltools:
        patterns:
          - '*'
